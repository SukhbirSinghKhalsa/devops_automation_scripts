name: Daily Update Yourself tryout 1

on:
  schedule:
    - cron: '30 2-11 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: windows-latest # Using Windows Agent
    steps:
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      # Note: On Windows, use 'curl.exe' or 'Invoke-WebRequest'
      - name: Fetch Private Resume
        run: |
          curl.exe -H "Authorization: token ${{ secrets.MY_GITHUB_PAT }}" `
          -H "Accept: application/vnd.github.v3.raw" `
          -o resume.pdf `
          -L "https://raw.githubusercontent.com/SukhbirSinghKhalsa/NOTES/updater/sukhbir-devops.pdf"
      - name: Setup Node & Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Run Automation
        env:
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          RESUME_PATH: ${{ github.workspace }}\resume.pdf
        run: node .github/scripts/updater.js