name: lazy paezi crazy hacks 

on:
  schedule:
    - cron: '30 2-11 * * *'
  workflow_dispatch:

jobs:
  update-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Public Repo
        uses: actions/checkout@v4
        
      - name: test-token
        run: |
          echo "Token length: ${#MY_GITHUB_PAT}"
        env:
          MY_GITHUB_PAT: ${{ secrets.MY_GITHUB_PAT }}
          
      - name: Fetch Files from Private Repo
        run: |
          # Fetch Resume
          curl -f -H "Authorization: Bearer ${{ secrets.MY_GITHUB_PAT }}" \
               -H "Accept: application/vnd.github.raw" \
               -L "https://api.github.com/repos/SukhbirSinghKhalsa/NOTES/contents/sukhbir-devops.pdf?ref=updater" \
               -o "resume.pdf"
      
          # Fetch Script
          curl -f -H "Authorization: Bearer ${{ secrets.MY_GITHUB_PAT }}" \
               -H "Accept: application/vnd.github.raw" \
               -L "https://api.github.com/repos/SukhbirSinghKhalsa/NOTES/contents/updater.js?ref=updater" \
               -o ".github/scripts/updater.js"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run Update Script
        env:
          NAUKRI_COOKIES: ${{ secrets.NAUKRI_COOKIES }}
          RESUME_PATH: "./resume.pdf"
        run: |
          # DEBUG: Check the first few lines of the script to see if it's real JS or a 404
          head -n 5 .github/scripts/updater.js
          
          # Run the actual script
          node .github/scripts/updater.js

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-debug-artifacts
          path: "*.png"
